<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="session-token" content="{{TOKEN}}">
  <title>M.A.L.I.E.C.A.</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>M.A.L.I.E.C.A.</h1>
      <span id="engine">Connexion…</span>
    </div>
  </header>
  <main>
    <nav aria-label="Données locales">
      <button type="button" data-command="/tache liste">Tâches</button>
      <button type="button" data-command="/note chercher">Notes</button>
      <button type="button" data-command="/document liste">Documents</button>
      <button type="button" data-command="/aide">Commandes</button>
    </nav>
    <section id="conversation" aria-label="Conversation" role="log" aria-live="polite"></section>
    <form id="composer">
      <label for="message">Votre message</label>
      <div class="input-row">
        <textarea id="message" rows="2" maxlength="4096" required
          placeholder="Écrivez un message ou une commande…"></textarea>
        <button type="submit">Envoyer</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
</body>
</html>
