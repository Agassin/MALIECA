name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and dev tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest
      - name: Évaluation de démonstration du tokenizer
        run: python scripts/evaluer_tokenizer.py

  native-llm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU backend and dev tools
        run: |
          python -m pip install 'torch==2.10.0+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Vérifier l'entraînement et l'inférence
        run: python -m pytest tests/test_native_llm.py
